name: shop_pos
description: Mobile POS for convenience stores
version: 1.2.17+32

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_app_check: ^0.3.1
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  cloud_functions: ^5.6.2
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.4
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.4
  image: ^4.2.0

  # URL launcher (Stripe Checkout)
  url_launcher: ^6.3.1

  # Barcode scanner
  # 7.x is the minimum that uses GoogleMLKit 8+/GoogleUtilities 8.x,
  # compatible with Firebase 11+
  mobile_scanner: ^7.0.0

  # QR rendering (PromptPay payment QR for online orders)
  qr_flutter: ^4.1.0

  # Bank notification listener (Android only) — auto-confirm PromptPay
  # online orders by reading banking app push notifications on the
  # shop owner's device. Read-only; never transmits raw notifications.
  notification_listener_service: ^0.3.4

  # Persist last-used POS payment method so the bottom sheet defaults
  # to whatever the shop used most recently.
  shared_preferences: ^2.3.2

  # Receipt
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.3

  # Audio
  audioplayers: ^6.0.0

  # Utils
  intl: ^0.19.0
  http: ^1.2.2
  uuid: ^4.5.1
  flutter_local_notifications: ^17.2.4

  # In-app update (Android closed distribution): read the running build,
  # then open the downloaded APK to launch the system installer.
  package_info_plus: ^8.1.0
  open_filex: ^4.5.0

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

  # Brand font — IBM Plex Sans Thai, matching the pok-pok.app website.
  # Bundled (not google_fonts) so the POS renders the brand face offline.
  fonts:
    - family: IBM Plex Sans Thai
      fonts:
        - asset: assets/fonts/IBMPlexSansThai-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansThai-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansThai-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansThai-Bold.ttf
          weight: 700
