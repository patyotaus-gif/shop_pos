<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480"><svg xmlns="http://www.w3.org/2000/svg" x="40" y="40" width="400" height="400" viewBox="0 0 1024 1024">
  <title>Minimal Burgundy Cooking App Icon</title>
  <desc>Minimal cooking app icon with a burgundy pan, upright handle and simple base on a white rounded square.</desc>
  <defs>
    <linearGradient id="burgundy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A51F3B"/>
      <stop offset="0.55" stop-color="#850D28"/>
      <stop offset="1" stop-color="#65091F"/>
    </linearGradient>
    <linearGradient id="pan" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#A71937"/>
      <stop offset="0.48" stop-color="#890D2A"/>
      <stop offset="1" stop-color="#69091F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.13"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <rect x="80" y="80" width="864" height="864" rx="180" fill="#FFFFFF" filter="url(#shadow)"/>

  <!-- Upright handle -->
  <rect x="466" y="176" width="92" height="292" rx="46" fill="url(#burgundy)"/>
  <circle cx="512" cy="420" r="26" fill="#FFFFFF"/>

  <!-- Pan bowl -->
  <path d="M238 512 H786
           C786 635 663 732 512 732
           C361 732 238 635 238 512 Z" fill="url(#pan)"/>
  <path d="M238 512 H786
           C754 566 658 617 512 617
           C366 617 270 566 238 512 Z" fill="#B32645" opacity="0.28"/>

  <!-- Minimal stand -->
  <rect x="340" y="754" width="344" height="18" rx="9" fill="url(#burgundy)"/>
  <rect x="424" y="766" width="176" height="20" rx="10" fill="#760A24"/>
</svg>
<text x="500" y="260" font-family="IBM Plex Sans Thai, sans-serif" font-size="170" font-weight="300" fill="#7A1F2B">pokpok</text><text x="510" y="350" font-family="sans-serif" font-size="36" letter-spacing="8" fill="#7A1F2B">POINT OF SALE</text></svg>
