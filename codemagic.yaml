workflows:
  ios-test:
    name: iOS Test Build (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - flutter_drive.log

  ios-release:
    name: iOS Release to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: pokpok-asc
    environment:
      # Skipping environment.ios_signing — Codemagic's preflight check
      # fails fast if it can't find a matching profile, never giving our
      # fetch-signing-files --create script a chance to run. Manage
      # signing entirely through the scripts below instead.
      vars:
        BUNDLE_ID: "app.pokpok.pos"
        APP_STORE_APP_ID: 6772182588
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APP_ID" || echo 0)
          cd $CM_BUILD_DIR
          BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Using build number $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Prepare certificate private key
        script: |
          # On first run there is no existing cert yet, so the CLI needs a
          # private key to create one. Use CERTIFICATE_PRIVATE_KEY from
          # Codemagic env vars if present (recommended after the first
          # successful build), otherwise generate one on the fly.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
            echo "Using CERTIFICATE_PRIVATE_KEY from env"
          else
            openssl genrsa -out /tmp/cert_key.pem 2048
            echo "Generated a fresh 2048-bit RSA private key"
            echo "After this build, save the key from the build artifacts"
            echo "into Codemagic env var CERTIFICATE_PRIVATE_KEY (secret)"
            echo "so subsequent builds reuse the same Apple Distribution cert."
          fi
      - name: Fetch signing files (auto-create cert + profile if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
      - name: Archive the cert private key (for first-run capture)
        script: |
          mkdir -p $CM_BUILD_DIR/ios/signing
          cp /tmp/cert_key.pem $CM_BUILD_DIR/ios/signing/cert_key.pem
      - name: Add certs to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=1.1.0 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/signing/cert_key.pem
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Internal testers (App Store Connect Users group) get builds automatically.
        # To add an external group later, uncomment and create the group in TestFlight first:
        # beta_groups:
        #   - Internal Testing
