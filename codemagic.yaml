workflows:
  ios-test:
    name: iOS Test Build (no signing)
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign
    artifacts:
      - build/ios/iphoneos/*.app
      - flutter_drive.log

  ios-release:
    name: iOS Release to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: pokpok-asc
    environment:
      # Skipping environment.ios_signing — Codemagic's preflight check
      # fails fast if it can't find a matching profile, never giving our
      # fetch-signing-files --create script a chance to run. Manage
      # signing entirely through the scripts below instead.
      groups:
        # Pulls in CERTIFICATE_PRIVATE_KEY (secret) so fetch-signing-files
        # can reuse the existing Apple Distribution certificate instead
        # of hitting Apple's 2-cert-per-account ceiling.
        - shop_pos
      vars:
        BUNDLE_ID: "app.pokpok.pos"
        APP_STORE_APP_ID: 6772182588
      flutter: 3.41.7
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set build number
        script: |
          # get-latest-build-number covers both TestFlight and App Store,
          # so we don't reuse a build number that's already in TestFlight
          # but not yet promoted to App Store.
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-build-number "$APP_STORE_APP_ID" || echo 0)
          cd $CM_BUILD_DIR
          BUILD_NUMBER=$(($LATEST_BUILD_NUMBER + 1))
          echo "Latest existing build: $LATEST_BUILD_NUMBER → using $BUILD_NUMBER"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> $CM_ENV
      - name: Initialize keychain
        script: |
          keychain initialize
      - name: Prepare certificate private key
        script: |
          # On first run there is no existing cert yet, so the CLI needs a
          # private key to create one. Use CERTIFICATE_PRIVATE_KEY from
          # Codemagic env vars if present (recommended after the first
          # successful build), otherwise generate one on the fly.
          if [ -n "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "$CERTIFICATE_PRIVATE_KEY" > /tmp/cert_key.pem
            echo "Using CERTIFICATE_PRIVATE_KEY from env"
          else
            openssl genrsa -out /tmp/cert_key.pem 2048
            echo "Generated a fresh 2048-bit RSA private key"
            echo "After this build, save the key from the build artifacts"
            echo "into Codemagic env var CERTIFICATE_PRIVATE_KEY (secret)"
            echo "so subsequent builds reuse the same Apple Distribution cert."
          fi
      - name: Fetch signing files (auto-create cert + profile if missing)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key=@file:/tmp/cert_key.pem \
            --create
      - name: Archive the cert private key (for first-run capture)
        script: |
          mkdir -p $CM_BUILD_DIR/ios/signing
          cp /tmp/cert_key.pem $CM_BUILD_DIR/ios/signing/cert_key.pem
      - name: Add certs to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --build-name=1.2.11 \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/signing/cert_key.pem
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Auto-deliver to the external public-link group "ร้านค้า" (its
        # public link is vA1VYAgZ). First build of a new version still goes
        # through Beta App Review before external testers can install. If
        # this publish step ever fails on the group name, add the build to
        # the group manually in App Store Connect instead.
        beta_groups:
          - "ร้านค้า"

  android-apk:
    name: Android Release APK (debug-signed)
    # No instance_type — defaults to the free-tier Linux runner.
    # linux_x2 is a paid tier and won't start on the current plan.
    max_build_duration: 60
    environment:
      flutter: 3.41.7
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build release APK
        # Uses the default debug keystore — fine for sideloading on the
        # shop owner's own device. Replace with a release keystore + signing
        # config when we publish to Play Store.
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - flutter_drive.log
