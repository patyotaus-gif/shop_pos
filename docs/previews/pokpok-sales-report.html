<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>รายงานยอดขาย · ตัวอย่าง Pokpok</title>
<link rel="stylesheet" href="../../public/brand.css">
<style>
@font-face{font-family:Plex;src:url('../../assets/fonts/IBMPlexSansThai-Regular.ttf')}
@font-face{font-family:Plex;font-weight:600;src:url('../../assets/fonts/IBMPlexSansThai-SemiBold.ttf')}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Plex,sans-serif;font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
header{background:var(--surface);border-bottom:1px solid var(--line)}.top,main{max-width:1240px;margin:auto;padding:0 clamp(16px,4vw,52px)}
.top,.heading,.row,.summary{display:flex;align-items:center;justify-content:space-between;gap:12px}.top{height:68px}.top img{width:105px}.top small{color:var(--muted)}
main{padding-bottom:36px}.heading{margin:32px 0 22px;flex-wrap:wrap}h1,h2,p{margin:0}h1{font-size:clamp(28px,4vw,42px);line-height:1.25}h2{font-size:20px}
.muted,.sub{color:var(--muted);font-size:14px}.heading select,.back{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px 12px;min-height:44px}
#metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.metric,.panel{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.metric{text-align:start;padding:16px 20px}.metric[aria-pressed=true]{background:var(--wine);color:white;border-color:var(--wine)}.metric strong{display:block;font-size:clamp(24px,3vw,36px);line-height:1.35}.metric small{display:block;margin-top:5px}
.columns{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}.panel{min-width:0;padding:22px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}.legend span:before{content:'';display:inline-block;width:11px;height:11px;background:var(--wine);margin-right:6px;border-radius:3px}.legend span+span:before{background:var(--line)}
.bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));margin:20px 0 16px}.day{padding:0;border:0;background:transparent;text-align:center;min-width:0;border-radius:6px}.plot{height:145px;display:flex;align-items:end;justify-content:center;gap:3px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(to top,transparent 0 35px,var(--paper) 35px 36px)}
.bar{width:26%;max-width:20px;border-radius:4px 4px 0 0;background:var(--wine)}.prior{background:var(--line)}.tick{font-size:13px;display:inline-block;padding:4px 2px}.day[aria-pressed=true] .tick{background:var(--rose);color:var(--wine);border-bottom:2px solid var(--wine)}.day:hover .plot{background-color:var(--rose)}
.note{padding:14px;background:var(--paper);border-radius:8px;font-size:15px}.list{list-style:none;margin:14px 0 0;padding:0}.list li{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding:10px 0}.list small{display:block;color:var(--muted)}.summary{border-top:1px solid var(--line);padding-top:12px;color:var(--wine)}
.back,.mobile-hint{display:none}
@media(max-width:760px){.columns{grid-template-columns:1fr}.metric{padding:12px}.panel{padding:18px}}
@media(max-width:599px){.top{height:54px}.heading{margin:20px 0 16px}.heading select{font-size:14px}#metrics{gap:5px}.metric{padding:10px 6px;font-size:13px}.metric strong{font-size:clamp(18px,5vw,26px)}.metric small{font-size:11px}.panel{padding:14px}.bars{margin:14px 0}.plot{height:125px}.mobile-hint{display:block;margin-top:12px}.details{display:none}body.drill .overview{display:none}body.drill .details,body.drill .back{display:block}body.drill .columns{display:block}body.drill .details{margin-top:12px}.back{margin-bottom:12px}.tick{font-size:12px}}
@media(max-width:599px){body.drill #metrics{display:none}}
</style>
<header><div class="top"><img src="../../public/brand/pokpok-wordmark.svg" alt="Pokpok"><small>ร้านตัวอย่าง · ข้อมูลจำลอง</small></div></header>
<main>
  <div class="heading overview"><h1>รายงานยอดขาย</h1><select id="period" aria-label="สัปดาห์ที่แสดง"><option value="2">9–15 พ.ย. 2569</option><option value="1">2–8 พ.ย. 2569</option></select></div>
  <div class="overview" id="metrics" aria-label="เลือกตัวเลขที่จะแสดงบนกราฟ"></div>
  <div class="columns">
    <article class="panel overview"><h2 id="chart-title"></h2><p class="sub" id="compare"></p>
      <div class="legend"><span>สัปดาห์ที่เลือก</span><span>สัปดาห์ก่อน</span></div>
      <div id="bars" class="bars" role="group" aria-label="เลือกวันเพื่อดูบิล"></div>
      <p class="note" id="note"></p><small class="muted mobile-hint">แตะวันที่บนกราฟเพื่อดูบิล</small>
    </article>
    <article class="panel details"><button class="back" id="back">← กลับไปกราฟ</button>
      <h2 id="bill-day" tabindex="-1"></h2><p class="sub" id="bill-count"></p>
      <ul id="bills" class="list"></ul><div class="summary"><span>ยอดขายสุทธิ</span><strong id="sum"></strong></div>
    </article>
  </div>
</main>
<script>
// Each sample bill contains one menu item. Derive the chart, comparisons and detail from those identical rows.
const menu = [['พาสต้ากุ้ง',180],['เครปเบอร์รี',120],['ชาไทย',60],['ข้าวกะเพรา',90],['กาแฟเย็น',75]];
const baskets = [
  ['0132','30123','0132','1203','31024','013201','030124'],
  ['0312','01324','00123','0314','013102','0013120','013201'],
  ['03102','010324','22334','013014','0013120','01030120','0130120']
];
const days=['จ.','อ.','พ.','พฤ.','ศ.','ส.','อา.'];
const names=['ยอดขายสุทธิ','จำนวนบิล','ยอดเฉลี่ยต่อบิล'];
const ranges=['26 ต.ค.–1 พ.ย.','2–8 พ.ย.','9–15 พ.ย.'];
const byId=id=>document.getElementById(id);
const n=value=>value.toLocaleString('th-TH',{maximumFractionDigits:2});
const money=value=>'฿'+n(value);
const bills=baskets.map(week=>week.map(day=>Array.from(day,Number)));
let week=2, day=2, metric=0;
function totals(rows){
  const sum=rows.reduce((amount,index)=>amount+menu[index][1],0);
  return [sum,rows.length,sum/rows.length];
}
function value(index,number){return index===1?n(number):money(number)}
function change(current,previous){
  const percent=(current/previous-1)*100;
  return Math.abs(percent)<0.05?'เท่าเดิม':(percent>0?'เพิ่ม ':'ลด ')+n(Math.round(Math.abs(percent)*10)/10)+'%';
}
function date(i){return (week===2?9:2)+i}
function render(){
  const now=bills[week],previous=bills[week-1];
  const currentTotals=totals(now.flat()),previousTotals=totals(previous.flat());
  byId('metrics').innerHTML=names.map((name,i)=>`<button class="metric" data-metric="${i}" aria-pressed="${metric===i}">${name}<strong>${value(i,currentTotals[i])}</strong><small>${change(currentTotals[i],previousTotals[i])} จากสัปดาห์ก่อน</small></button>`).join('');
  byId('chart-title').textContent=names[metric]+'รายวัน';
  byId('compare').textContent=ranges[week]+' เทียบกับ '+ranges[week-1]+' 2569';
  const currentDays=now.map(rows=>totals(rows)[metric]),priorDays=previous.map(rows=>totals(rows)[metric]);
  const max=Math.max(...currentDays,...priorDays);
  byId('bars').innerHTML=days.map((name,i)=>`<button class="day" data-day="${i}" aria-label="${name} ${date(i)} พ.ย. ${names[metric]} ${value(metric,currentDays[i])}" aria-pressed="${day===i}"><span class="plot"><span class="bar prior" style="height:${priorDays[i]/max*96}%"></span><span class="bar" style="height:${currentDays[i]/max*96}%"></span></span><span class="tick">${name} ${date(i)}</span></button>`).join('');
  const today=totals(now[day]),last=totals(previous[day]);
  byId('note').textContent=`${days[day]} ${date(day)} พ.ย. ยอดขาย${change(today[0],last[0])} เทียบวันเดียวกันของสัปดาห์ก่อน · ${today[1]} บิล (เดิม ${last[1]}) · เฉลี่ย ${money(today[2])} ต่อบิล (เดิม ${money(last[2])})`;
  byId('bill-day').textContent='บิลวันที่ '+date(day)+' พฤศจิกายน';
  byId('bill-count').textContent=today[1]+' บิล';
  byId('sum').textContent=money(today[0]);
  byId('bills').innerHTML=now[day].map((id,i)=>`<li><div>${menu[id][0]}<small>${10+i}:15 น. · บิล ${date(day)}-${String(i+1).padStart(3,'0')}</small></div><strong>${money(menu[id][1])}</strong></li>`).reverse().join('');
}
byId('period').onchange=e=>{week=Number(e.target.value);render()};
byId('metrics').onclick=e=>{const b=e.target.closest('button');if(b){metric=Number(b.dataset.metric);render();document.querySelector('[data-metric="'+metric+'"]').focus({preventScroll:true})}};
byId('bars').onclick=e=>{const b=e.target.closest('button');if(!b)return;day=Number(b.dataset.day);render();
  if(matchMedia('(max-width:599px)').matches){document.body.classList.add('drill');byId('bill-day').focus()}
  else document.querySelector('[data-day="'+day+'"]').focus({preventScroll:true});
};
byId('back').onclick=()=>{document.body.classList.remove('drill');document.querySelector('[data-day="'+day+'"]').focus()};
render();
</script>
</html>
