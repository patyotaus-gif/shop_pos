<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ออเดอร์ · ตัวอย่าง Pokpok</title>
<link rel="stylesheet" href="../../public/brand.css">
<style>
@font-face{font-family:Plex;src:url('../../assets/fonts/IBMPlexSansThai-Regular.ttf')}
@font-face{font-family:Plex;font-weight:600;src:url('../../assets/fonts/IBMPlexSansThai-SemiBold.ttf')}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 Plex,sans-serif;font-variant-numeric:tabular-nums}
button,input{font:inherit}button,a{touch-action:manipulation}button{cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--wine);outline-offset:2px}
header{background:var(--surface);border-bottom:1px solid var(--line)}.wrap{width:min(1140px,94%);margin:auto}
.mast,.line,.tools,.detail-head,.total{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mast{min-height:66px}.mast img{width:104px}.mast a{color:var(--wine);padding:10px 0}
h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,4vw,42px)}h2{font-size:21px}h3{font-size:16px}
main{padding:24px 0 44px}.line{margin-bottom:14px}small,.sub{color:var(--muted);font-size:14px}
.queues{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.queue,.panel{border:1px solid var(--line);background:var(--surface);border-radius:var(--radius)}
.queue{padding:13px 18px;text-align:start;display:grid;grid-template-columns:1fr auto;align-items:center;gap:3px 8px}.queue small{grid-column:1/-1}.queue strong{font-size:26px}
.queue[aria-pressed=true],.action{background:var(--wine);color:white;border-color:var(--wine)}.queue[aria-pressed=true] small{color:white}
.tools{flex-wrap:wrap;margin:18px 0}.views{display:flex;gap:8px;flex-wrap:wrap}.views button,.back{border:1px solid var(--line);background:white;border-radius:8px;padding:8px 12px;min-height:44px}.views button[aria-pressed=true]{background:var(--rose);border-color:var(--wine);color:var(--wine)}
input{border:1px solid var(--line);border-radius:8px;padding:9px 12px;width:min(100%,260px);background:white;color:var(--ink)}
.board{display:grid;grid-template-columns:minmax(0,1.18fr) minmax(0,1fr);gap:16px;align-items:start}.panel{overflow:hidden;min-width:0}.panel-head,.detail{padding:20px}.panel-head{border-bottom:1px solid var(--line)}
.order{display:grid;width:100%;grid-template-columns:1fr auto;align-items:center;gap:5px 12px;border:0;border-bottom:1px solid var(--line);background:white;text-align:start;padding:14px 20px}.order:last-child{border-bottom:0}.order[aria-pressed=true]{background:var(--rose);box-shadow:inset 3px 0 var(--wine)}.order span:last-child{text-align:end}.order strong,.order small{display:block}
.pay{font-size:13px}.paid{color:#295d4a}.unpaid{color:#865512}.badge{padding:4px 10px;border:1px solid var(--line);border-radius:18px;font-size:14px}
.meta,.item,.total{padding:12px 0;border-bottom:1px solid var(--line)}.meta,.item{display:flex;align-items:baseline;justify-content:space-between;gap:12px}.items{margin-top:18px}.total{border:0;color:var(--wine)}.total strong{font-size:24px}.action{width:100%;border:0;border-radius:8px;min-height:46px;font-weight:600;margin-top:12px}
.empty{padding:24px}.back{display:none}.sr{position:absolute;width:1px;height:1px;clip-path:inset(50%);overflow:hidden}
@media(max-width:639px){main{padding-top:16px}.mast{min-height:54px}.queues{gap:5px}.queue{display:flex;flex-direction:column;align-items:start;gap:0;padding:9px;font-size:14px}.queue strong{font-size:23px}.queue small{display:none}.tools{gap:10px}.tools input{width:100%}.board{display:block}.detail{display:none}.order{padding:12px}.drill .detail{display:block}.drill .overview{display:none}.drill .back{display:inline-block;margin-bottom:12px}}
</style>
<header><div class="wrap mast"><img src="../../public/brand/pokpok-wordmark.svg" alt="Pokpok"><a href="pokpok-sales-report.html">ดูรายงานยอดขาย ↗</a></div></header>
<main class="wrap">
  <div class="line overview"><h1>ออเดอร์</h1><small>ร้านตัวอย่าง · ข้อมูลจำลอง</small></div>
  <div class="queues overview" id="queues" aria-label="คิวออเดอร์"></div>
  <div class="tools overview"><div id="views" class="views"></div><input id="search" type="search" aria-label="ค้นหาเลขออเดอร์หรือเมนู" placeholder="ค้นหาเลขออเดอร์หรือเมนู"></div>
  <button id="back" class="back">← กลับไปที่คิว</button>
  <div class="board">
    <section class="panel overview" aria-labelledby="list-title"><div class="panel-head"><h2 id="list-title"></h2></div><div id="list"></div></section>
    <section class="panel detail" id="detail" aria-label="รายละเอียดออเดอร์" tabindex="-1"></section>
  </div>
  <p class="sr" id="announcement" role="status"></p>
</main>
<script>
const stages = [
  {name:'รอยืนยัน', hint:'ตรวจการชำระและรับออเดอร์'},
  {name:'กำลังเตรียม', hint:'ออเดอร์ที่ครัวกำลังทำ'},
  {name:'พร้อมรับ', hint:'รอส่งมอบให้ลูกค้า'},
  {name:'นัดล่วงหน้า'}, {name:'ประวัติ'}
];
const dishes = {pasta:['พาสต้ากุ้ง',180], tea:['ชาไทย',60], rice:['ข้าวกะเพรา',90], coffee:['กาแฟเย็น',75]};
const sample = [
  ['001','11:02',1,'ชำระแล้ว',[['pasta',1],['tea',2]]],
  ['002','11:05',2,'ชำระแล้ว',[['rice',2]]],
  ['003','11:08',1,'ชำระแล้ว',[['rice',2],['coffee',1]]],
  ['004','11:12',0,'ชำระแล้ว',[['pasta',2],['coffee',1]]],
  ['005','11:14',0,'รอตรวจสลิป',[['tea',2]]],
  ['006','11:17',0,'รอชำระ',[['coffee',1],['rice',1]]],
  ['007','11:19',3,'ชำระแล้ว',[['pasta',3]]],
  ['008','11:21',4,'ชำระแล้ว',[['rice',1],['tea',1]]]
];
const orders=sample.map(([id,time,stage,payment,items])=>({id,time,stage,payment,items}));
const money=v=>'฿'+v.toLocaleString('th-TH');
const total=o=>o.items.reduce((sum,[key,qty])=>sum+dishes[key][1]*qty,0);
const el=id=>document.getElementById(id);
let stage=0, selected='004';
function stageButtons(start,end,primary){
  return stages.slice(start,end).map(({name,hint},offset)=>{
    const i=start+offset,count=orders.filter(o=>o.stage===i).length;
    return `<button data-stage="${i}" aria-pressed="${stage===i}" class="${primary?'queue':''}">${name} <strong>${count}</strong>${hint?`<small>${hint}</small>`:''}</button>`;
  }).join('');
}
function pay(o){return `<span class="pay ${o.payment==='ชำระแล้ว'?'paid':'unpaid'}">${o.payment}</span>`}
function draw(){
  el('queues').innerHTML=stageButtons(0,3,true);
  el('views').innerHTML=stageButtons(3,5,false);
  const q=el('search').value.trim().toLowerCase();
  const visible=orders.filter(o=>o.stage===stage&&[o.id,...o.items.map(([key])=>dishes[key][0])].some(s=>s.toLowerCase().includes(q)));
  const order=visible.find(o=>o.id===selected)??visible[0];
  selected=order?.id;
  el('list-title').textContent=stages[stage].name+' · '+visible.length+' ออเดอร์';
  el('list').innerHTML=visible.map(o=>`<button class="order" data-order="${o.id}" aria-pressed="${o.id===selected}"><span><strong>ออนไลน์ ${o.id}</strong><small>${o.time} น. · ${o.items.map(([key,qty])=>dishes[key][0]+' × '+qty).join(', ')}</small></span><span><strong>${money(total(o))}</strong>${pay(o)}</span></button>`).join('')||'<p class="empty">ไม่พบออเดอร์ในคิวนี้</p>';
  if(!order){el('detail').innerHTML='<p class="sub">เลือกคิวหรือเปลี่ยนคำค้นเพื่อดูรายละเอียด</p>';return}
  const action=order.payment==='ชำระแล้ว'?['รับออเดอร์','พร้อมรับแล้ว','ส่งมอบแล้ว'][stage]:null;
  el('detail').innerHTML=`<div class="detail-head"><h2>ออนไลน์ ${order.id}</h2><span class="badge">${stages[stage].name}</span></div>
    <div class="meta"><small>เวลาสั่ง</small><span>${order.time} น.</span></div>
    ${stage===3?'<div class="meta"><small>นัดรับ</small><span>พรุ่งนี้ 10:00–10:15 น.</span></div>':''}
    <div class="meta"><small>การชำระเงิน</small>${pay(order)}</div>
    <h3 class="items">รายการอาหาร</h3>${order.items.map(([key,qty])=>`<div class="item"><span>${dishes[key][0]} × ${qty}</span><strong>${money(dishes[key][1]*qty)}</strong></div>`).join('')}
    <div class="total"><span>ยอดรวม</span><strong>${money(total(order))}</strong></div>
    ${action?`<button class="action" id="advance">${action}</button>`:''}`;
}
function changeStage(i){
  stage=i;el('search').value='';document.body.classList.remove('drill');draw();
  document.querySelector('[data-stage="'+i+'"]').focus();
}
document.addEventListener('click',event=>{
  const btn=event.target.closest('button');if(!btn)return;
  if(btn.hasAttribute('data-stage'))return changeStage(Number(btn.dataset.stage));
  if(btn.hasAttribute('data-order')){
    selected=btn.dataset.order;draw();
    if(matchMedia('(max-width:639px)').matches){document.body.classList.add('drill');el('detail').focus()}
    else document.querySelector('[data-order="'+selected+'"]').focus();
  }
  if(btn.id==='back'){document.body.classList.remove('drill');document.querySelector('[data-order="'+selected+'"]')?.focus()}
  if(btn.id==='advance'){
    const order=orders.find(o=>o.id===selected);
    order.stage=[1,2,4][order.stage];
    el('announcement').textContent='ออนไลน์ '+order.id+' ย้ายไป'+stages[order.stage].name;
    changeStage(order.stage);
  }
});
el('search').addEventListener('input',draw);
draw();
</script>
</html>
