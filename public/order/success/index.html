<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สถานะออเดอร์</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=20261104" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'IBM Plex Sans Thai', system-ui, -apple-system, sans-serif; font-weight: 400; background: #F5F1EC; color: #1F1A1B; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: #FFFFFF; border-radius: 20px; padding: 36px 28px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(31, 26, 27, 0.06); border: 1px solid #E5DDD3; }
    h1 { color: #7A1F2B; font-size: 22px; font-weight: 600; margin-bottom: 8px; }
    h1.confirmed { color: #15803d; }
    .subtitle { color: #6B5E60; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .subtitle:empty { display: none; }
    .note { background: #F0E2E4; border-radius: 10px; padding: 12px 16px; color: #7A1F2B; font-size: 13px; font-weight: 500; }
  </style>
</head>
<body>
  <main class="card">
    <h1 aria-live="polite">สถานะออเดอร์</h1>
    <p id="description" class="subtitle">กำลังตรวจสอบสถานะกับร้าน…</p>
    <p id="orderNumber" class="subtitle" style="overflow-wrap:anywhere"></p>
    <p id="pickup" class="subtitle" style="white-space:pre-line"></p>
    <div class="note">หากโอนเงินแล้ว ไม่ต้องโอนซ้ำ</div>
  </main>
  <script type="module" src="/order/js/receipt.js"></script>
</body>
</html>
