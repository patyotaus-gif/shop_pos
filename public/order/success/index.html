<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>สั่งสินค้าสำเร็จ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f0fdf4; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 20px; padding: 36px 28px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .icon { font-size: 72px; margin-bottom: 16px; }
    h1 { color: #16a34a; font-size: 22px; margin-bottom: 8px; }
    .subtitle { color: #6b7280; font-size: 15px; line-height: 1.6; margin-bottom: 24px; }
    .steps { text-align: left; background: #f9fafb; border-radius: 12px; padding: 16px 20px; margin-bottom: 24px; }
    .step { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; font-size: 14px; color: #374151; }
    .step-num { background: #1e40af; color: white; border-radius: 50%; width: 22px; height: 22px; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
    .note { background: #eff6ff; border-radius: 10px; padding: 12px 16px; color: #1e40af; font-size: 13px; font-weight: 600; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>สั่งสินค้าสำเร็จ!</h1>
    <p class="subtitle">ขอบคุณที่สั่งซื้อ<br/>ร้านค้าได้รับ order ของคุณแล้ว</p>
    <div class="steps">
      <div class="step"><div class="step-num">1</div><span>ร้านค้าตรวจสอบและยืนยัน order</span></div>
      <div class="step"><div class="step-num">2</div><span>เตรียมสินค้าให้พร้อม</span></div>
      <div class="step"><div class="step-num">3</div><span>ร้านแจ้งเมื่อสินค้าพร้อมรับ</span></div>
      <div class="step"><div class="step-num">4</div><span>มารับสินค้าที่ร้านได้เลย</span></div>
    </div>
    <div class="note">ร้านจะติดต่อกลับทางโทรศัพท์เมื่อสินค้าพร้อม</div>
  </div>
</body>
</html>
