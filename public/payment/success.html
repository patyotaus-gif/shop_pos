<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ชำระเงินสำเร็จ — Shop POS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0fdf4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 40px 32px;
      max-width: 400px;
      width: 90%;
      text-align: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { color: #16a34a; font-size: 22px; margin-bottom: 8px; }
    p { color: #6b7280; font-size: 15px; line-height: 1.6; }
    .hint {
      margin-top: 24px;
      background: #f0fdf4;
      border-radius: 8px;
      padding: 12px 16px;
      color: #15803d;
      font-size: 14px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>ชำระเงินสำเร็จ!</h1>
    <p>ขอบคุณที่สมัคร Shop POS<br/>subscription ของคุณถูกเปิดใช้งานแล้ว</p>
    <div class="hint">กลับไปที่แอป Shop POS เพื่อเริ่มใช้งาน</div>
  </div>
</body>
</html>
